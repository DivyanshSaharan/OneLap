previews:
  generation: off

services:
  - type: web
    name: onelap
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: ONELAP_SERVE_FRONTEND
        value: 'true'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ONELAP_AUTH_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ONELAP_MONGODB_DATABASE
        value: onelap
      - key: TINKER_API_KEY
        sync: false
      - key: ONELAP_HOSTED_REQUESTS_ENABLED
        value: 'false'
      - key: ONELAP_MODEL_TARGET
        value: adapter
      - key: ONELAP_CHECKPOINT_APPROVED
        value: 'true'
      - key: ONELAP_CHECKPOINT_RECEIPT
        value: /etc/secrets/onelap-checkpoint-receipt.json
      - key: ONELAP_CHECKPOINT_RECEIPT_SHA256
        value: eed06decf5bedd51684ae5065c434203605c372294284e0ae4f63a8f243829eb
      - key: ONELAP_DATA_SHARING_APPROVED
        value: 'false'
      - key: ONELAP_REFLECTION_SHARING_APPROVED
        value: 'false'
      - key: ONELAP_APPROVED_BUDGET_USD
        value: '0'
      - key: ONELAP_MAX_MODEL_REQUESTS
        value: '20'
      - key: ONELAP_BUDGET_STORAGE
        value: atlas
      - key: ONELAP_ATLAS_BUDGET_APPROVED
        value: 'false'
      - key: ONELAP_BUDGET_IMPORT_USD
        sync: false
      - key: ONELAP_BUDGET_IMPORT_REQUESTS
        sync: false
      - key: ONELAP_JOURNAL_ENABLED
        value: 'false'
      - key: ONELAP_ATLAS_SHARING_APPROVED
        value: 'false'
      - key: ONELAP_TRACING_ENABLED
        value: 'false'
      - key: ONELAP_TRACE_SHARING_APPROVED
        value: 'false'
