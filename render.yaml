previews:
  generation: off

services:
  - type: web
    name: onelap
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: ONELAP_SERVE_FRONTEND
        value: 'true'
      - key: ONELAP_ACCESS_TOKEN
        sync: false
      - key: ONELAP_HOSTED_REQUESTS_ENABLED
        value: 'false'
      - key: ONELAP_DATA_SHARING_APPROVED
        value: 'false'
      - key: ONELAP_REFLECTION_SHARING_APPROVED
        value: 'false'
      - key: ONELAP_APPROVED_BUDGET_USD
        value: '0'
      - key: ONELAP_JOURNAL_ENABLED
        value: 'false'
      - key: ONELAP_ATLAS_SHARING_APPROVED
        value: 'false'
